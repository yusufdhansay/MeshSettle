# TEMPLATE ONLY. Contains no real credentials or keys.
#
# Copy to secret.yaml (gitignored), fill in real values, and apply it. Or
# better, do not create it by hand at all: generate it from the same source of
# truth the rest of the project uses, so the keys in the cluster match the ones
# the sender signs with.
#
#   python scripts/bootstrap_env.py          # if you have no .env yet
#   kubectl create secret generic meshsettle-settlement-secrets \
#     --from-literal=POSTGRES_USER="$(grep '^POSTGRES_USER=' .env | cut -d= -f2-)" \
#     --from-literal=POSTGRES_PASSWORD="$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)" \
#     --from-literal=RABBITMQ_USER="$(grep '^RABBITMQ_USER=' .env | cut -d= -f2-)" \
#     --from-literal=RABBITMQ_PASSWORD="$(grep '^RABBITMQ_PASSWORD=' .env | cut -d= -f2-)" \
#     --from-literal=SENDER_SIGNING_PUBLIC_KEY_PEM="$(...)" \
#     --from-literal=SETTLEMENT_RSA_PRIVATE_KEY_PEM="$(...)"
#
# `scripts/k8s_secret.sh` does exactly that, correctly quoted.
#
# Why the settlement service gets these two keys and not the others:
#   * SENDER_SIGNING_PUBLIC_KEY_PEM  — needed to VERIFY packet signatures.
#     A public key, but kept here so it is managed alongside the rest.
#   * SETTLEMENT_RSA_PRIVATE_KEY_PEM — needed to UNWRAP the AES content key.
#     This is the one genuinely sensitive key in the system: whoever holds it
#     can read every payment instruction. It belongs only to settlement.
# The sender's SIGNING PRIVATE key must never be deployed here. Settlement has
# no reason to be able to mint packets, and giving it that ability would let a
# compromised settlement pod forge payments.
#
# In a real deployment, use a sealed/external secret manager (Sealed Secrets,
# External Secrets Operator, SOPS, or your cloud's secret store) rather than a
# plaintext Secret manifest. A Kubernetes Secret is base64, not encrypted.
apiVersion: v1
kind: Secret
metadata:
  name: meshsettle-settlement-secrets
  labels:
    app.kubernetes.io/name: meshsettle
    app.kubernetes.io/component: settlement
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  RABBITMQ_USER: "REPLACE_ME"
  RABBITMQ_PASSWORD: "REPLACE_ME"
  # PEM blocks, with real newlines. YAML block scalars keep them readable.
  SENDER_SIGNING_PUBLIC_KEY_PEM: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
  SETTLEMENT_RSA_PRIVATE_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
