[project]
name = "meshsettle"
version = "0.1.0"
description = "Offline-first payment settlement simulation with exactly-once guarantees"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "cryptography==50.0.1",
    "aio-pika==9.5.4",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "slowapi==0.1.9",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "ruff==0.8.4",
    "locust==2.32.5",
    "pip-audit==2.7.3",
]

[tool.setuptools]
# Subpackages listed explicitly so `pip install .` inside a container ships
# every service module, not just the two top-level packages.
packages = [
    "shared",
    "services",
    "services.sender",
    "services.mesh_relay",
    "services.bridge",
    "services.settlement",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires Redis/Postgres/RabbitMQ to be running",
]
